<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ========================================================================
     1. Reusable Document Head Fragment
     ======================================================================== -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' — Lease Approval Workflow' : 'Lease Approval Workflow'}">Lease Approval
        Workflow</title>

    <!-- Design System CSS (Self-contained, zero external CDN dependencies) -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

    <!-- ========================================================================
     2. Reusable Header & Navigation Bar Fragment
     ======================================================================== -->
    <header th:fragment="navbar(activeTab)" class="app-navbar">
        <div class="container container-xl">
            <div class="navbar-inner">
                <!-- Brand & Inline SVG Logo -->
                <a th:href="@{/}" class="navbar-brand">
                    <span class="brand-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </span>
                    <span>LeaseFlow</span>
                    <span class="brand-badge">Workflow</span>
                </a>

                <!-- Navigation Links -->
                <nav aria-label="Main Navigation">
                    <ul class="navbar-nav">
                        <li>
                            <a th:href="@{/}" class="nav-link" th:classappend="${activeTab == 'home' ? 'active' : ''}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                                </svg>
                                <span>Home</span>
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/submit-request}" class="nav-link"
                                th:classappend="${activeTab == 'submit' ? 'active' : ''}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 5v14M5 12h14"></path>
                                </svg>
                                <span>Submit Request</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <!-- Quick Action / CTA -->
                <div class="navbar-actions">
                    <a th:href="@{/submit-request}" class="btn btn-primary btn-sm">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>New Request</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- ========================================================================
     3. Reusable Alerts / Flash Messages Fragment
     ======================================================================== -->
    <div th:fragment="alerts" class="alerts-container">
        <!-- Success Banner -->
        <div th:if="${successMessage != null}" class="alert alert-success" role="alert">
            <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <div class="alert-content">
                <span th:text="${successMessage}">Operation completed successfully.</span>
            </div>
        </div>

        <!-- Error Banner -->
        <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert">
            <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <div class="alert-content">
                <span th:text="${errorMessage}">An error occurred during processing.</span>
            </div>
        </div>
    </div>

    <!-- ========================================================================
     4. Reusable Footer Fragment
     ======================================================================== -->
    <footer th:fragment="footer" class="app-footer">
        <div class="container container-xl">
            <div class="footer-inner">
                <div class="footer-brand">
                    <span style="font-weight: 600; color: var(--text-secondary);">LeaseFlow</span>
                    <span class="footer-separator">&bull;</span>
                    <span class="footer-desc">Automated Lease Document Approval Workflow</span>
                </div>
                <div class="footer-meta">
                    <span class="health-indicator">
                        <span class="health-pulse"></span>
                        <a th:href="@{/actuator/health}">System Online</a>
                    </span>
                    <span class="footer-separator">&bull;</span>
                    <span class="version-badge"
                        th:text="${appVersion != null ? (appVersion.startsWith('v') ? appVersion : 'v' + appVersion) : 'v1.0.0'}">v1.0.0</span>
                    <span class="footer-separator">&bull;</span>
                    <span class="delivery-note">Delivered via Jenkins, Docker, and Ansible workflow</span>
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
